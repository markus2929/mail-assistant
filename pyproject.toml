[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailassistant"
version = "0.1.0"
description = "Self-hosted, local-LLM email assistant for Proton Mail and Google Calendar"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "markus2929" }]
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tzdata>=2024.1",  # IANA timezone data for zoneinfo (not present in slim images)
  "jinja2>=3.1",     # dashboard templates (Phase 6), autoescaped
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]  # httpx: FastAPI TestClient

[tool.hatch.build.targets.wheel]
packages = ["src/mailassistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

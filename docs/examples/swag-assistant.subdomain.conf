## Mail Assistant dashboard - reachable from the home network and the WireGuard VPN ONLY.
## Everything else gets 403: the dashboard shows your mailbox and is not meant for the open internet.
## Upstream: the dashboard's own HTTPS on the shared Docker network (alias mail-assistant, internal port 8443).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assistant.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 1m;

    allow 192.168.1.0/24;     # home network - adjust to yours (also covers the router when it loops traffic back)
    allow 10.13.13.0/24;      # WireGuard VPN
    deny all;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app mail-assistant;
        set $upstream_port 8443;
        set $upstream_proto https;   # the dashboard's self-signed certificate; traffic stays on the Docker network
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

# Example: the dashboard alone on another host (e.g. a home server), separate from the desktop that runs
# Bridge, Ollama, the worker and the scheduler. The web app needs ONLY the database and its own secrets.
#
#   docker compose -f docker-compose.web.yml up -d
#
# Requirements:
# - secrets/database_url points at a PostgreSQL both hosts can reach, with TLS verified, e.g.
#   postgresql+psycopg://mailassistant:...@db.home.lan:5432/mailassistant?sslmode=verify-full&sslrootcert=/run/secrets/db_ca
#   (mail content travels over the network). Recommended: run PostgreSQL on the server, so the dashboard
#   keeps working while the desktop is off; your decisions are queued and carried out when it is back.
# - Run migrations from ONE place only (the desktop's `migrate` service, or `alembic upgrade head` here).
# - Behind a reverse proxy that terminates TLS: WEB_TLS=proxy, WEB_TRUSTED_PROXIES=<proxy address>,
#   and remove the web_tls_* secrets.
services:
  web:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    image: mailassistant:dev
    command: ["python", "-m", "mailassistant.web"]
    env_file: .env.web          # WEB_HOST=0.0.0.0, WEB_PORT=8443, WEB_ALLOWED_HOSTS=..., TIMEZONE=...
    ports: ["8443:8443"]        # no host networking needed
    secrets: [database_url, web_password_hash, web_tls_cert, web_tls_key]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

secrets:
  database_url: {file: ./secrets/database_url}
  web_password_hash: {file: ./secrets/web_password_hash}
  web_tls_cert: {file: ./secrets/web_tls_cert}
  web_tls_key: {file: ./secrets/web_tls_key}

name: mailassistant

# HOME-SERVER layout: everything except Ollama runs on an always-on server.
# - PostgreSQL and Proton Bridge are only reachable inside this compose network (nothing published).
# - Only the dashboard is published (HTTPS on 8443).
# - Ollama runs on another machine (e.g. the desktop with the GPU) behind the HTTPS token proxy from
#   docker-compose.ollama-proxy.yml; set OLLAMA_BASE_URL, OLLAMA_CERT_SHA256 and secrets/ollama_token.
# One computer for everything instead? Use docker-compose.single-host.yml. Setup: docs/SERVER_SETUP.md.

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: mailassistant:dev
  env_file: .env
  secrets: [database_url]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  labels: {com.centurylinklabs.watchtower.enable: "false"}   # update deliberately (git pull + build), not via Watchtower

services:
  db:
    image: postgres:17
    labels: {com.centurylinklabs.watchtower.enable: "false"}   # update deliberately (git pull + build), not via Watchtower
    environment:
      POSTGRES_USER: mailassistant
      POSTGRES_DB: mailassistant
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      default:
        aliases: [mailassistant-db]   # use THIS name in database_url: plain "db" can clash when a service also
                                      # joins another network (e.g. Home Assistant's) that has its own "db"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mailassistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  bridge:
    build:
      context: .
      dockerfile: docker/bridge.Dockerfile
    image: mailassistant-bridge:dev
    labels: {com.centurylinklabs.watchtower.enable: "false"}   # update deliberately (git pull + build), not via Watchtower
    volumes: ["bridge:/home/bridge"]     # login, keychain and Bridge's mail cache
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # IMAP on bridge:1144 inside this network only (STARTTLS, pinned); never published on the server

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    command: ["python", "-m", "mailassistant.web"]
    environment:
      WEB_HOST: 0.0.0.0                   # inside the container; reachable through the published port
    ports: ["${WEB_PUBLISH_PORT:-8443}:8443"]   # outside port; set WEB_PUBLISH_PORT in .env if 8443 is taken
    # Database only - no Google/IMAP/Ollama/Fernet secrets (the dashboard never talks to those)
    secrets: [database_url, web_password_hash, web_tls_cert, web_tls_key, capture_token]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["python", "-m", "mailassistant.jobs.worker"]
    secrets: [database_url, imap_password, fernet_key, google_client, ha_token, ollama_token]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bridge: {condition: service_started}

  scheduler:
    <<: *app
    command: ["python", "-m", "mailassistant.jobs.scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  bridge:

secrets:
  database_url: {file: ./secrets/database_url}      # postgresql+psycopg://mailassistant:<db_password>@mailassistant-db:5432/mailassistant
  db_password: {file: ./secrets/db_password}
  imap_password: {file: ./secrets/imap_password}    # shown by Bridge after login (docs/SERVER_SETUP.md)
  fernet_key: {file: ./secrets/fernet_key}
  google_client: {file: ./secrets/google_client}
  web_password_hash: {file: ./secrets/web_password_hash}
  web_tls_cert: {file: ./secrets/web_tls_cert}
  web_tls_key: {file: ./secrets/web_tls_key}
  ha_token: {file: ./secrets/ha_token}              # empty file = Home Assistant notifications off
  capture_token: {file: ./secrets/capture_token}    # empty file = voice capture API off
  ollama_token: {file: ./secrets/ollama_token}      # token of the Ollama proxy on the desktop

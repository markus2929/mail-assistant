{% extends "base.html" %}
{% block title %}Log in - Mail Assistant{% endblock %}
{% block main %}
<section class="login">
  <h1>Mail Assistant</h1>
  {% if not configured %}
  <p class="warn">No password has been set. On the desktop run
    <code>python -m mailassistant.web.setpassword</code> and restart the web service.</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button>Log in</button>
  </form>
</section>
{% endblock %}
